<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon</title>
    <style>
        #maze{
            width: 100vw;
            height: 100vh;
            display:block;
        }
        #START{
            position:absolute;
            left:50%;
            top:50%;
            transform:translate(-50%, -50%);
        }
    </style>
    <script>
        "use strict";
        let scroller = new Scroller();
        Player.prototype = scroller;
        Alien.prototype = scroller;

        const W = 31;
        const H = 31;
        const GAMECLEAR = 1;
        const GAMEOVER = 2;
        const maze = [];
        const player = new Player(1, 1)
        const aliens = [new Alien(W - 2, 1), new Alien(1, W - 2)];
        let ctx;
        let keyCode = 0;
        let status = 0;
        let timer = NaN;
        let canvas;
        let tileSize;
        let centerX;
        let centerY;
        let panelWidth;
        let panelX;
        let miniMapSize;

        window.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('audio').forEach(a => {
                a.volume = 0.2; // 20% 音量
            });
        });

        function Scroller(){
            this.doScroll = function(){
                if(this.dx == 0 && this.dy == 0){
                    return;
                }

                if(++this.scrollCount >= 5){
                    this.x = this.x + this.dx;
                    this.y = this.y + this.dy;
                    this.dx = 0;
                    this.dy = 0;
                    this.scrollCount = 0;
                }
            }

            this.getScrollX = function(){
                return this.x * tileSize +
                    this.dx * this.scrollCount * (tileSize / 5);
            }

            this.getScrollY = function(){
                return this.y * tileSize +
                    this.dy * this.scrollCount * (tileSize / 5);
            }      
        }

        function Player(x, y){
            this.x = x;
            this.y = y;
            this.dx = 0;
            this.dy = 0;
            this.dir = 0;
            this.scrollCount = 0;

            this.update = function(){
                this.doScroll();
                if(this.scrollCount > 0){
                    return;
                }

                if(this.x == W - 2 && this.y == H -2){
                    clearInterval(timer);
                    status = GAMECLEAR;
                    document.getElementById("bgm").pause();
                    repaint();
                }

                this.dx = 0;
                this.dy = 0;
                let nx = 0;
                let ny = 0;
                switch(keyCode){
                    case 37:
                        nx = -1;
                        this.dir = 2;
                        break;
                    case 38:
                        ny = -1;
                        this.dir = 0;
                        break;
                    case 39:
                        nx = +1;
                        this.dir = 3;
                        break;
                    case 40:
                        ny = +1;
                        this.dir = 1;
                        break;
                }
                if(maze[this.y + ny][this.x + nx] == 0){
                    this.dx = nx;
                    this.dy = ny;
                }
            }

            this.paint = function(gc, x, y, w, h){
                let img = document.getElementById("hero" + this.dir);
                gc.drawImage(img, x, y, w, h);
            }
        }

        function Alien(x, y){
            this.x = x;
            this.y = y;
            this.dx = 0;
            this.dy = 0;
            this.dir = 0;
            this.scrollCount = 0;

            this.update = function(){
                this.doScroll();

                if (this.scrollCount > 0) {
                    return;
                }

                let diffX = Math.abs(player.getScrollX() - this.getScrollX());
                let diffY = Math.abs(player.getScrollY() - this.getScrollY());
                if(diffX <= 40 && diffY <= 40){
                    clearInterval(timer);
                    status = GAMEOVER;
                    document.getElementById("bgm").pause();
                    repaint();
                }

                let gapx = player.x - this.x;
                let gapy = player.y - this.y;
                switch(random(4)){
                    case 0:
                        this.dx = gapx > 0 ? 1 : -1;
                        this.dir = this.dx == -1 ? 2 : 3;
                        break;
                    case 1:
                        this.dy = gapy > 0 ? 1 : -1;
                        this.dir = this.dy == -1 ? 0 : 1;
                        break;
                    default:
                        this.dx = 0;
                        this.dy = 0;
                        break;
                }
            }

            this.paint = function (gc, w, h) {
                let img = document.getElementById("alien" + this.dir);
                gc.drawImage(img, this.getScrollX(), this.getScrollY(), w, h); // 敵描画
            };
        };

        function random(v){
            return Math.floor(Math.random() * v);
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            centerX = canvas.width / 2;
            centerY = canvas.height / 2;

            tileSize = Math.min(canvas.width, canvas.height) / 12;

            // 追加部分
            panelWidth = canvas.width * 0.25;
            panelX = canvas.width - panelWidth;

            miniMapSize = panelWidth * 0.8;
        }

        function init(){
            canvas = document.getElementById("maze");
            ctx = canvas.getContext("2d");

            resizeCanvas();

            window.addEventListener("resize", () => {
                resizeCanvas();
                repaint();
            });

            createMaze(W, H);
            repaint();
        }

        function go(){
            window.onkeydown = mykeydown;
            window.onkeyup = mykeyup;

            let maze = document.getElementById("maze");
            maze.onmousedown = mymousedown;
            maze.onmouseup = mykeyup;
            maze.oncontextmenu = function(e){
                e.preventDefault();
            }
            maze.addEventListener("touchstart", mymousedown);
            maze.addEventListener("touchend", mykeyup);

            timer = setInterval(tick, 45);
            document.getElementById("START").style.display = "none";
            document.getElementById("bgm").play();
        }

        function tick(){
            player.update();
            aliens.forEach((a) => a.update());
            repaint();
        }

        function createMaze(w, h){
            for(let y = 0; y < h; y++){
                maze[y] = [];
                for(let x = 0; x < w; x++){
                    maze[y][x] = x == 0 || x == w - 1 || y == 0 || y == h - 1 ? 1 : 0;
                }
            }

            for(let y = 2; y < h - 2; y += 2){
                for(let x = 2; x < w - 2; x += 2){
                    maze[y][x] = 1;

                    let dir = random(y == 2 ? 4 : 3);
                    let px = x;
                    let py = y;
                    switch(dir){
                        case 0:
                            py++;
                            break;
                        case 1:
                            px--;
                            break;
                        case 2:
                            px++;
                            break;
                        case 3:
                            py--;
                            break;
                    }
                    maze[py][px] = 1;
                }
            }
        }

        function drawCircle(x, y, r, color){
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }

        function repaint(){
            ctx.fillStyle = "black";
            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            ctx.save();
            ctx.beginPath();
            ctx.arc(
                centerX,
                centerY,
                Math.min(centerX, centerY),
                0,
                Math.PI * 2
            );
            ctx.clip();

            ctx.fillStyle = "brown";
            ctx.translate(
                centerX,
                centerY
            );
            ctx.translate(-1 * player.getScrollX(), -1 * player.getScrollY());
            for(let x=0; x<W; x++){
                for(let y=0; y<H; y++){
                    if(maze[y][x] == 1){
                        ctx.fillRect(
                            x * tileSize,
                            y * tileSize,
                            tileSize,
                            tileSize
                        );
                    }
                }
            }
            aliens.forEach((a) => a.paint(ctx, tileSize, tileSize));
            ctx.restore();

            ctx.fillStyle = "#eeeeee";
            ctx.fillRect(
                panelX,
                0,
                panelWidth,
                canvas.height
            );

            ctx.save();
            ctx.translate(
                panelX + panelWidth * 0.1,
                canvas.height * 0.5
            );
            ctx.fillStyle = "brown";
            for(let x=0; x<W; x++){
                for(let y=0; y<H; y++){
                    if(maze[y][x] == 1){
                        let miniCell = miniMapSize / W;
                        ctx.fillRect(
                            x * miniCell,
                            y * miniCell,
                            miniCell,
                            miniCell
                        );
                    }
                }
            }
            drawCircle(
                player.x * miniCell + miniCell / 2,
                player.y * miniCell + miniCell / 2,
                miniCell / 2,
                "red"
            );
            aliens.forEach((a) => {
                drawCircle(a.x*7+3, a.y*7+3, 3, "purple");
            });

            ctx.restore();

            ctx.drawImage(arrows, 670, 70, 200, 200);
            let ax = -100;
            let ay = -100;
            switch(keyCode){
                case 39:
                    ax = 830;
                    ay = 170;
                    break;
                case 40:
                    ax = 770;
                    ay = 230;
                    break;
                case 37:
                    ax = 710;
                    ay = 170;
                    break;
                case 38:
                    ax = 770;
                    ay = 120;
                    break;
            }
            drawCircle(ax, ay, 30, "yellow");

            player.paint(
                ctx,
                centerX - tileSize/2,
                centerY - tileSize/2,
                tileSize,
                tileSize
            );
            ctx.fillStyle = "yellow";
            if(status == GAMEOVER){
                ctx.fillText("GAME OVER", 150, 200);
            }else if(status == GAMECLEAR){
                ctx.fillText("GAME CLEAR", 150, 200);
            }
        }

        function mykeydown(e){
            keyCode = e.keyCode;
        }
        function mykeyup(e){
            keyCode = 0;
        }
        function mymousedown(e){
            let mouseX = !isNaN(e.offsetX) ? e.offsetX : e.touches[0].clientX;
            let mouseY = !isNaN(e.offsetY) ? e.offsetY : e.touches[0].clientY;
            if(670<mouseX && mouseX<870 && 70<mouseY && mouseY<270){
                mouseX -= 770;
                mouseY -= 170;
                if(Math.abs(mouseX) > Math.abs(mouseY)){
                    keyCode = mouseX < 0 ? 37:39;
                }else{
                    keyCode = mouseY < 0 ? 38:40;
                }
            }
        }
    </script>
</head>
<body onload="init()">
    <audio src="audio/Emergency.mp3" id="bgm" loop="loop"></audio>
    <canvas id="maze" width="900" height="600"></canvas>
    <img id="START" src="img/start.png" onclick="go()" alt="">
    <img id="arrows" src="img/arrows.png" style="display: none;" alt="">

    <img id="hero0" src="img/hero0.png" style="display: none;" alt="">
    <img id="hero1" src="img/hero1.png" style="display: none;" alt="">
    <img id="hero2" src="img/hero2.png" style="display: none;" alt="">
    <img id="hero3" src="img/hero3.png" style="display: none;" alt="">
    <img id="alien0" src="img/alien0.png" style="display: none;" alt="">
    <img id="alien1" src="img/alien1.png" style="display: none;" alt="">
    <img id="alien2" src="img/alien2.png" style="display: none;" alt="">
    <img id="alien3" src="img/alien3.png" style="display: none;" alt="">
</body>
</html>
